version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitsphere_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://splitsphere:splitsphere_pass@postgres:5432/splitspheredb?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=splitsphere_jwt_secret_production_key_32_chars
      - JWT_REFRESH_SECRET=splitsphere_refresh_secret_production_key_32_chars
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: splitsphere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitsphere
      POSTGRES_PASSWORD: splitsphere_pass
      POSTGRES_DB: splitspheredb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitsphere -d splitspheredb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: splitsphere_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
